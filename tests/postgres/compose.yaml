# Disposable PostgreSQL for dialect-sensitive API migrations.
# Mutually exclusive with the root compose.yaml on host 5433. When the MVP
# stack is up, point TEST_DATABASE_URL at it instead of starting this file.
# TEST_DATABASE_URL=postgresql://analyzer:analyzer@127.0.0.1:5433/analyzer
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: analyzer
      POSTGRES_PASSWORD: analyzer
      POSTGRES_DB: analyzer
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analyzer -d analyzer"]
      interval: 2s
      timeout: 5s
      retries: 10
