name: Verify

on:
  pull_request:
  push:
    branches:
      - main
      - module1lesson5

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install API and quality dependencies
        run: python -m pip install -r requirements-api.txt -r requirements-dev.txt
      - name: Lint
        run: ruff check src tests scripts run_ablation.py
      - name: Type check
        run: mypy
      - name: Test API and artifact behavior
        run: python -m pytest tests/test_api.py tests/test_migrations.py tests/test_shared_state_repository.py tests/test_inference_dispatch.py tests/test_model_package.py tests/test_artifacts.py tests/test_object_store.py -m "not ml"

  inference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install inference and quality dependencies
        run: python -m pip install -r requirements-inference.txt -r requirements-dev.txt
      - name: Lint inference paths
        run: ruff check src/inference_service src/modules/hdfs_inference.py src/modules/hdfs_parity.py scripts/verify_hdfs_parity.py tests/test_inference_service.py tests/test_hdfs_inference_parity.py
      - name: Type check inference paths
        run: mypy src/inference_service scripts/verify_hdfs_parity.py
      - name: Test frozen inference and parity behavior
        run: python -m pytest tests/test_inference_service.py tests/test_hdfs_inference_parity.py -m ml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build
        run: npm ci && npm run build
